<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Computer Engineering Academic Records & Lab Management Hub</title>
  <meta name="description" content="Academic record management system for Computer Engineering department featuring editable lecture schedules, lab timetables, and student lab participation tracking for 195 students.">
  
  <!-- Google Fonts: Inter & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div id="app">
    <!-- Sticky Top Navigation Bar -->
    <div id="navbar-container"></div>

    <!-- Active View Container -->
    <main class="main-content">
      <div id="view-container"></div>
    </main>
  </div>

  <!-- Toast Notification Portal -->
  <div id="toast-container"></div>

  <!-- Dynamic Modal & Dialog Portal -->
  <div id="modal-portal"></div>

  <!-- Firebase Cloud Firestore SDK (Compat v10.8.0) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <!-- Standalone Production JavaScript Bundle (Works on http://localhost:8080 & local file://) -->
  <script src="js/bundle.js"></script>
</body>
</html>
